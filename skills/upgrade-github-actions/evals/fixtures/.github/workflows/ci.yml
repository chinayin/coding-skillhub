name: CI
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Login to Docker Hub
        uses: docker/login-action@v2
      - uses: ./local-action
      - uses: docker://alpine:3.19
